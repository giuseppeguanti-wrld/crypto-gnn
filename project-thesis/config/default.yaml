data:
  # Public endpoint, no API key, close uniformly at 00:00 UTC -- citable in the thesis.
  source: binance
  quote: USDT
  interval: 1d
  # Covers Terra/Luna (2022-05) and FTX (2022-11) with an ample pre-crisis period.
  start: 2021-01-01
  end: 2026-06-30
  # Continuously quoted on Binance since December 2020; no stablecoin (near-zero
  # correlation with the rest of the universe -- an isolated node in the graph).
  symbols: [BTC, ETH, BNB, XRP, ADA, SOL, DOGE, DOT, AVAX,
            LINK, LTC, BCH, XLM, TRX, ETC]

graph:
  # T_w=60 with N=15 gives the Marchenko-Pastur aspect ratio q=N/T_w=0.25, so the
  # theoretical upper edge (1+sqrt(q))^2 = 2.25 sits where sec:6.6 needs it.
  window: 60
  weight: mantegna
  self_loops: true
  threshold:
    method: permutation
    alpha: 0.05
    n_permutations: 500
    n_calibration_windows: 24
    statistic: pooled
    tau_fixed: 0.30

features:
  lags: 5
  vol_windows: [5, 20]
  use_volume: true

walkforward:
  train: 365
  val: 63
  test: 63
  step: 63
  mode: rolling

model:
  gcn:
    hidden: [16, 32]
    dropout: [0.2, 0.5]
    lr: 0.005
    weight_decay: 5.0e-4
    epochs: 300
    patience: 30
    seeds: [0, 1, 2, 3, 4]
  # fixed_lag: pre-registered robustness variant, fixed before any test result
  # was seen. BIC selects p=0 on all 24 folds, so the VAR would otherwise never
  # estimate a single cross-asset coefficient; forcing p=5 gives the multivariate
  # comparator the study needs, and the 15*(15*5+1) = 1140 coefficients from 365
  # observations.
  var: {max_lag: 5, ic: bic, fixed_lag: 5}
  ar:  {max_lag: 5, ic: bic}

backtest:
  cost_bps: 10

seed: 42
